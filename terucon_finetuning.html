<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Terucon Annotate: private image annotation workspace for SAM 3 segmentation data (interactive demo).">
<title>Terucon Annotate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Terucon Annotate — styles. Tokens first; dark tokens are injected by build.py at DARK_TOKENS markers. */
:root {
  --font: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --fs-xs: 12px; --fs-s: 13px; --fs-m: 14px; --fs-b: 15px; --fs-r: 16px; --fs-l: 19px; --fs-xl: 23px; --fs-xxl: 28px;
  --bg: #ECEAE5; --panel: #F9F8F5; --panel-2: #F1EFEA; --panel-3: #E5E2DB; --line: #D9D5CD; --line-2: #BDB7AC;
  --text: #1E1D1B; --text-2: #4C4843; --text-3: #68635B;
  --ink: #23221F; --ink-hover: #3A3834; --on-ink: #F9F8F5;
  --well: #2B2926; --well-line: #3B3834;
  --ok: #2C7651; --ok-bg: #E1EFE6; --warn: #8A5205; --warn-bg: #F7EAD5; --danger: #AF2A1F; --danger-bg: #F8E1DD; --info: #33567A; --info-bg: #E2E9F1;
  --suggest: #FF2DAA;
  --focus-a: #F9F8F5; --focus-b: #23221F;
  --shadow-1: 0 1px 2px rgba(25,22,18,.08);
  --shadow-float: 0 10px 30px rgba(25,22,18,.22), 0 1px 3px rgba(25,22,18,.14);
  --scrim: rgba(20,18,16,.48);
  --tap: 36px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #161513; --panel: #1E1D1A; --panel-2: #252421; --panel-3: #2F2D29; --line: #36332F; --line-2: #4D4943; --text: #EEEBE5; --text-2: #CAC5BC; --text-3: #A39D93; --ink: #EEEBE5; --ink-hover: #FFFFFF; --on-ink: #191816; --well: #121110; --well-line: #2A2825; --ok: #72C79A; --ok-bg: #15261D; --warn: #E9AE52; --warn-bg: #2C2213; --danger: #F2897F; --danger-bg: #311A17; --info: #93B7DD; --info-bg: #162130; --focus-a: #191816; --focus-b: #EEEBE5; --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-float: 0 12px 34px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.5); --scrim: rgba(0,0,0,.6); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #161513; --panel: #1E1D1A; --panel-2: #252421; --panel-3: #2F2D29; --line: #36332F; --line-2: #4D4943; --text: #EEEBE5; --text-2: #CAC5BC; --text-3: #A39D93; --ink: #EEEBE5; --ink-hover: #FFFFFF; --on-ink: #191816; --well: #121110; --well-line: #2A2825; --ok: #72C79A; --ok-bg: #15261D; --warn: #E9AE52; --warn-bg: #2C2213; --danger: #F2897F; --danger-bg: #311A17; --info: #93B7DD; --info-bg: #162130; --focus-a: #191816; --focus-b: #EEEBE5; --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-float: 0 12px 34px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.5); --scrim: rgba(0,0,0,.6); color-scheme: dark; }
.zone-dark { --bg: #161513; --panel: #1E1D1A; --panel-2: #252421; --panel-3: #2F2D29; --line: #36332F; --line-2: #4D4943; --text: #EEEBE5; --text-2: #CAC5BC; --text-3: #A39D93; --ink: #EEEBE5; --ink-hover: #FFFFFF; --on-ink: #191816; --well: #121110; --well-line: #2A2825; --ok: #72C79A; --ok-bg: #15261D; --warn: #E9AE52; --warn-bg: #2C2213; --danger: #F2897F; --danger-bg: #311A17; --info: #93B7DD; --info-bg: #162130; --focus-a: #191816; --focus-b: #EEEBE5; --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-float: 0 12px 34px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.5); --scrim: rgba(0,0,0,.6); color-scheme: dark; }
@media (pointer: coarse) { :root { --tap: 44px; } }
:root.density-large { --tap: 48px; }

:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--fs-b); line-height: 1.45; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; font-weight: 700; letter-spacing: -0.005em; }
h1 { font-size: var(--fs-xxl); } h2 { font-size: var(--fs-xl); } h3 { font-size: var(--fs-l); } h4 { font-size: var(--fs-r); }
p { margin: 0; }
.muted { color: var(--text-2); } .faint { color: var(--text-3); } .small { font-size: var(--fs-s); } .xsmall { font-size: var(--fs-xs); }
.nowrap { white-space: nowrap; } .num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.i-s { width: 16px; height: 16px; } .i-l { width: 24px; height: 24px; }
:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--focus-a), 0 0 0 4px var(--focus-b); border-radius: 6px; }
.row { display: flex; align-items: center; gap: 8px; } .row-wrap { flex-wrap: wrap; } .grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; } .gap-s { gap: 4px; } .gap-l { gap: 16px; }
.spacer { flex: 1; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel); color: var(--text); font-weight: 600; font-size: var(--fs-m); cursor: pointer; white-space: nowrap; text-decoration: none; user-select: none; }
.btn:hover { background: var(--panel-2); }
.btn:active { transform: translateY(1px); }
.btn[disabled], .icon-btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn-primary:hover { background: var(--ink-hover); }
.btn-quiet { border-color: transparent; background: transparent; }
.btn-quiet:hover { background: var(--panel-2); }
.btn-danger { color: var(--danger); border-color: currentColor; background: transparent; }
.btn-danger:hover { background: var(--danger-bg); }
.btn-ok { background: var(--ok); color: var(--on-ink); border-color: var(--ok); }
.btn-ok:hover { background: var(--ok); filter: brightness(1.08); }
.btn-sm { min-height: 30px; padding: 0 10px; font-size: var(--fs-s); border-radius: 7px; }
@media (pointer: coarse) { .btn-sm { min-height: 40px; } }
.btn-block { width: 100%; }
.icon-btn { width: var(--tap); height: var(--tap); display: inline-grid; place-items: center; border-radius: 8px; border: 1px solid transparent; background: transparent; color: inherit; cursor: pointer; flex: none; position: relative; }
.icon-btn:hover { background: var(--panel-2); }
.icon-btn:active { transform: translateY(1px); }
.icon-btn[aria-pressed="true"], .icon-btn.is-on { background: var(--ink); color: var(--on-ink); }
.icon-btn .kbd-hint { position: absolute; right: 2px; bottom: 1px; font-size: 9px; opacity: .6; line-height: 1; }
.linklike { background: none; border: 0; padding: 0; color: var(--text); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font-weight: 600; }
kbd { font-family: inherit; font-size: 12px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line-2); background: var(--panel-2); }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .label { font-weight: 600; font-size: var(--fs-s); color: var(--text-2); }
.input, select.input, textarea.input { min-height: var(--tap); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel); color: var(--text); width: 100%; }
textarea.input { min-height: 72px; resize: vertical; line-height: 1.4; }
.input:focus-visible { box-shadow: 0 0 0 2px var(--focus-a), 0 0 0 4px var(--focus-b); }
input[type="range"] { accent-color: var(--ink); width: 100%; min-height: 28px; }
.zone-dark input[type="range"] { accent-color: #E8E4DC; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--ink); width: 18px; height: 18px; }
input[type="color"] { width: 44px; height: 36px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--panel); padding: 2px; cursor: pointer; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: var(--tap); padding: 6px 0; cursor: pointer; }
.switch .switch-text { display: flex; flex-direction: column; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 9px; padding: 2px; background: var(--panel-2); gap: 2px; }
.seg button { min-height: calc(var(--tap) - 6px); padding: 0 12px; border: 0; border-radius: 7px; background: transparent; cursor: pointer; font-weight: 600; font-size: var(--fs-s); color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: var(--shadow-1); }
.zone-dark .seg button[aria-pressed="true"] { background: var(--panel-3); }
.seg-block { display: flex; } .seg-block button { flex: 1; justify-content: center; }

/* ---------- badges & status ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: var(--fs-xs); font-weight: 700; background: var(--panel-3); color: var(--text-2); white-space: nowrap; }
.badge .i { width: 13px; height: 13px; stroke-width: 2.2; }
.badge-ok { background: var(--ok-bg); color: var(--ok); } .badge-warn { background: var(--warn-bg); color: var(--warn); }
.badge-danger { background: var(--danger-bg); color: var(--danger); } .badge-info { background: var(--info-bg); color: var(--info); }
.badge-ink { background: var(--ink); color: var(--on-ink); } .badge-outline { background: transparent; border: 1px solid var(--line-2); }
.badge-demo { background: transparent; border: 1px dashed var(--line-2); color: var(--text-2); }
.badge-locked { color: var(--text); background: repeating-linear-gradient(45deg, var(--panel-3) 0 4px, var(--panel-2) 4px 8px); border: 1px solid var(--line-2); }
.status { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 15px; font-size: var(--fs-s); font-weight: 700; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text-2); white-space: nowrap; }
.status .i { width: 15px; height: 15px; stroke-width: 2.2; }
.status[data-s="saved_local"] { color: var(--info); background: var(--info-bg); border-color: currentColor; }
.status[data-s="sync_pending"] { color: var(--warn); background: var(--warn-bg); border-color: currentColor; border-style: dashed; }
.status[data-s="synced"] { color: var(--ok); background: var(--ok-bg); border-color: currentColor; }
.status[data-s="submitted"] { color: var(--on-ink); background: var(--ink); border-color: var(--ink); }
.status[data-s="save_failed"] { color: var(--danger); background: var(--danger-bg); border: 2px solid currentColor; }
.status[data-s="readonly"] { border-style: dotted; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; flex: none; }

/* ---------- app shell ---------- */
#app { height: 100%; display: flex; flex-direction: column; min-height: 0; }
.appbar { flex: none; height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 16px 0 18px; background: var(--panel); border-bottom: 1px solid var(--line); position: relative; z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: var(--fs-r); white-space: nowrap; }
.brand-mark { width: 22px; height: 22px; border-radius: 5px; background: var(--ink); position: relative; overflow: hidden; flex: none; }
.brand-mark::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, transparent 0 4px, var(--panel) 4px 6px); clip-path: polygon(0 0, 100% 100%, 0 100%); }
.appnav { display: flex; gap: 2px; align-items: center; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.appnav a { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: var(--fs-m); color: var(--text-2); white-space: nowrap; }
.appnav a:hover { background: var(--panel-2); color: var(--text); }
.appnav a[aria-current="page"] { color: var(--text); background: var(--panel-3); }
.appbar-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.nav-toggle { display: none; }
.page { flex: 1; overflow: auto; min-height: 0; }
.page-inner { max-width: 1240px; margin: 0 auto; padding: 24px 20px 56px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head p { margin-top: 6px; max-width: 70ch; }
.section { margin-top: 28px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.panel-pad { padding: 16px; }
.divided > * + * { border-top: 1px solid var(--line); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.menu-drawer { position: fixed; inset: 0; z-index: 90; display: none; }
.menu-drawer.open { display: block; }
.menu-drawer .scrim { position: absolute; inset: 0; background: var(--scrim); }
.menu-drawer .drawer { position: absolute; top: 0; bottom: 0; left: 0; width: min(320px, 86vw); background: var(--panel); padding: calc(16px + env(safe-area-inset-top, 0px)) 12px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 4px; box-shadow: var(--shadow-float); overflow: auto; }
.menu-drawer .drawer a, .menu-drawer .drawer button.menu-item { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-weight: 600; background: none; border: 0; width: 100%; text-align: left; cursor: pointer; }
.menu-drawer .drawer a[aria-current="page"] { background: var(--panel-3); }

/* ---------- lists & tables ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.table { width: 100%; border-collapse: collapse; font-size: var(--fs-m); }
.table th { text-align: left; font-size: var(--fs-s); color: var(--text-2); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel-2); white-space: nowrap; position: sticky; top: 0; }
.table td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table tr.is-clickable { cursor: pointer; }
.table tr.is-clickable:hover td { background: var(--panel-2); }
.table tr.is-selected td { background: var(--info-bg); }
.table .t-right { text-align: right; }
.thumb { width: 64px; height: 44px; border-radius: 5px; object-fit: cover; background: var(--panel-3); display: block; flex: none; }
.thumb-lg { width: 128px; height: 88px; }
.thumb-skel { display: block; }
.class-dots { display: inline-flex; gap: 3px; align-items: center; }
.class-dots span { width: 10px; height: 10px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.tasklist { display: flex; flex-direction: column; }
.taskrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); text-decoration: none; }
.taskrow:first-child { border-top: 0; }
.taskrow:hover { background: var(--panel-2); }
.taskrow .t-title { font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.taskrow .t-meta { color: var(--text-2); font-size: var(--fs-s); margin-top: 3px; display: flex; gap: 12px; flex-wrap: wrap; }
.empty { padding: 28px 18px; text-align: left; color: var(--text-2); display: flex; gap: 12px; align-items: flex-start; }
.empty .i { width: 28px; height: 28px; color: var(--text-3); }
.skel { background: var(--panel-3); border-radius: 6px; }
.skel-line { height: 12px; border-radius: 6px; background: var(--panel-3); }
.loading-pulse { animation: pulse 1.4s ease-in-out infinite; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: var(--fs-m); }
.kv dt { color: var(--text-2); } .kv dd { margin: 0; font-weight: 600; }
.bar { height: 8px; border-radius: 4px; background: var(--panel-3); overflow: hidden; display: flex; }
.bar > span { display: block; height: 100%; background: var(--ink); }
.bar > span.b-ok { background: var(--ok); } .bar > span.b-warn { background: var(--warn); } .bar > span.b-info { background: var(--info); }
.bar > span.b-hatch { background: repeating-linear-gradient(45deg, var(--text-3) 0 3px, transparent 3px 6px); }
.metric { display: flex; flex-direction: column; gap: 2px; }
.metric .m-val { font-size: var(--fs-xl); font-weight: 700; }
.metric .m-lab { color: var(--text-2); font-size: var(--fs-s); }
.callout { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); }
.callout .i { margin-top: 1px; }
.callout-warn { border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: var(--warn-bg); color: var(--text); }
.callout-warn > .i { color: var(--warn); }
.callout-info { background: var(--info-bg); border-color: color-mix(in srgb, var(--info) 35%, transparent); }
.callout-info > .i { color: var(--info); }
.callout-ok { background: var(--ok-bg); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.callout-ok > .i { color: var(--ok); }
.callout-danger { background: var(--danger-bg); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.callout-danger > .i { color: var(--danger); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { height: 42px; padding: 0 10px; border: 0; background: none; cursor: pointer; font-weight: 700; font-size: var(--fs-m); color: var(--text-2); border-bottom: 2px solid transparent; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); }
.tabs .count { font-size: 11px; background: var(--panel-3); border-radius: 9px; padding: 1px 6px; }

/* ---------- swatches & legend (signature element) ---------- */
.swatch { width: 24px; height: 24px; border-radius: 5px; background-color: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.28); flex: none; display: inline-block; }
.swatch-s { width: 14px; height: 14px; border-radius: 3px; }
.pat-horiz { background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.42) 0 2px, transparent 2px 6px); }
.pat-vert { background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.42) 0 2px, transparent 2px 6px); }
.pat-diag { background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.42) 0 2px, transparent 2px 7px); }
.pat-anti { background-image: repeating-linear-gradient(-45deg, rgba(0,0,0,.42) 0 2px, transparent 2px 7px); }
.pat-cross { background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.4) 0 2px, transparent 2px 7px), repeating-linear-gradient(90deg, rgba(0,0,0,.4) 0 2px, transparent 2px 7px); }
.pat-dots { background-image: radial-gradient(circle, rgba(0,0,0,.5) 1.4px, transparent 1.8px); background-size: 6px 6px; }
.legend { display: flex; flex-direction: column; }
.legend-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px; min-height: 52px; padding: 2px 6px 2px 10px; border-left: 4px solid transparent; border-top: 1px solid var(--line); }
.li-select { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: center; min-height: 48px; padding: 4px 0; background: none; border: 0; text-align: left; cursor: pointer; color: inherit; font: inherit; width: 100%; }
.li-text { display: flex; flex-direction: column; min-width: 0; }
.li-name kbd { font-size: 10px; padding: 0 5px; vertical-align: 1px; }
.legend-item:first-child { border-top: 0; }
.legend-item:hover { background: var(--panel-2); }
.legend-item.is-active { border-left-color: var(--c); background: var(--panel-2); }
.legend-item .li-name { font-weight: 700; font-size: var(--fs-m); display: block; }

.st-untouched { color: var(--danger) !important; }

.lchips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 8px 10px; }
.lchip { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 12px 0 8px; border-radius: 20px; border: 1px solid var(--line-2); background: var(--panel-2); cursor: pointer; font-weight: 700; font-size: var(--fs-s); white-space: nowrap; color: var(--text); flex: none; }

/* ---------- workspace ---------- */
.ws { position: relative; height: 100%; flex: 1 1 auto; display: flex; flex-direction: column; background: var(--bg); min-height: 0; }
.ws-top, .ws-banners { flex: none; }

.ws-title { display: flex; flex-direction: column; min-width: 0; }

.ws-canvas-wrap { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.viewer-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

.ws-hud-right { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 3; }
.ws-float { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; z-index: 4; width: min(560px, calc(100% - 20px)); pointer-events: none; }
.fcard { pointer-events: auto; width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-float); padding: 12px 14px; }
.fcard-title { font-weight: 700; display: flex; align-items: center; gap: 8px; }

/* inspector */

.msg-a { background: var(--panel-2); border: 1px solid var(--line); }

.msg-meta { font-size: var(--fs-xs); color: var(--text-2); margin-top: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.prompt-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.prompt-chip { border: 1px solid var(--line-2); background: var(--panel); border-radius: 16px; padding: 7px 12px; font-size: var(--fs-s); cursor: pointer; text-align: left; min-height: 36px; }

.hist { display: flex; flex-direction: column; }
.hist-item { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 7px; cursor: pointer; background: none; border: 0; text-align: left; width: 100%; color: inherit; min-height: 40px; }

.hist-item.is-future { opacity: .48; }

.flag { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; background: var(--panel); }

.note-card { border-left: 4px solid var(--c, var(--warn)); background: var(--panel-2); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.decision-seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.decision-seg button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px; min-height: 56px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; font-weight: 700; font-size: var(--fs-s); text-align: center; line-height: 1.15; }

.inst-list { display: flex; flex-direction: column; gap: 4px; }
.inst-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px; align-items: center; padding: 3px 4px 3px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
.inst-row.is-active { border-color: var(--text); box-shadow: inset 3px 0 0 var(--c); }
.inst-row button.inst-pick { background: none; border: 0; text-align: left; padding: 6px 0; cursor: pointer; font-weight: 600; min-height: 34px; color: inherit; }
.time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.time-grid .t-lab { font-size: var(--fs-xs); color: var(--text-2); }
.progress-line { display: flex; align-items: center; gap: 10px; }

/* focus / full-screen mode */

.ws.is-focus .focus-ui { display: block; }

.ws.is-focus .ws-hud-right { top: 58px; }
.ws.focus-fallback { position: fixed; inset: 0; z-index: 80; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); background: var(--well); }
.focus-top { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; gap: 8px; align-items: center; z-index: 5; pointer-events: none; }
.focus-top > * { pointer-events: auto; }
.focus-bar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 2px; align-items: center; padding: 4px; border-radius: 14px; background: rgba(22,21,19,.88); border: 1px solid rgba(255,255,255,.14); color: #F2EFE9; z-index: 5; max-width: calc(100% - 20px); overflow-x: auto; scrollbar-width: none; }
.focus-bar .icon-btn:hover { background: rgba(255,255,255,.1); }
.focus-bar .icon-btn[aria-pressed="true"] { background: #F2EFE9; color: #1E1D1B; }
.focus-bar .sep { width: 1px; height: 24px; background: rgba(255,255,255,.2); margin: 0 4px; flex: none; }
.focus-legend { position: absolute; left: 10px; top: 58px; z-index: 5; display: flex; flex-direction: column; gap: 4px; max-height: calc(100% - 140px); overflow: auto; }
.focus-legend .lchip { background: rgba(22,21,19,.86); color: #F2EFE9; border-color: rgba(255,255,255,.18); min-height: 36px; }
.focus-legend .lchip.is-active { background: #F2EFE9; color: #1E1D1B; }
.focus-panel { position: absolute; right: 10px; top: 58px; bottom: 76px; width: min(380px, calc(100% - 20px)); z-index: 6; display: flex; flex-direction: column; background: var(--panel); color: var(--text); border-radius: 12px; border: 1px solid var(--line); box-shadow: var(--shadow-float); overflow: hidden; }
.focus-panel-head { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; border-bottom: 1px solid var(--line); font-weight: 700; }
.focus-panel-body { overflow: auto; flex: 1; }

/* ---------- overlays ---------- */
.toast-host { position: fixed; left: 50%; top: calc(62px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 200; width: min(520px, calc(100% - 24px)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 14px; border-radius: 10px; background: #252421; color: #F4F1EB; box-shadow: var(--shadow-float); font-size: var(--fs-m); border: 1px solid rgba(255,255,255,.1); }

.toast .btn { background: transparent; color: #F4F1EB; border-color: rgba(255,255,255,.35); min-height: 32px; }
.modal-backdrop { position: fixed; inset: 0; background: var(--scrim); z-index: 150; display: grid; place-items: center; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
.modal { background: var(--panel); color: var(--text); border-radius: 14px; width: min(640px, 100%); max-height: 100%; overflow: auto; box-shadow: var(--shadow-float); display: flex; flex-direction: column; }

pre.code { margin: 0; padding: 12px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5; overflow: auto; max-height: 420px; white-space: pre; }

/* ---------- login ---------- */
.login { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
.login-art { position: relative; background: var(--well); overflow: hidden; }
.login-art canvas, .login-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

.role-list { display: flex; flex-direction: column; gap: 10px; }
.role-btn { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; text-align: left; color: inherit; }

.role-btn .avatar { width: 44px; height: 44px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--panel-3); color: var(--text); flex: none; }

/* ---------- worker home ---------- */
.resume { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; align-items: stretch; padding: 14px; }
.resume img, .resume .skel { width: 100%; height: 148px; object-fit: cover; border-radius: 8px; }
.stat-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stat-row > div { background: var(--panel); padding: 14px 16px; }

/* ---------- review ---------- */
.rv { height: 100%; flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
.rv > .ws-top, .rv > .ws-banners { flex: none; }
.rv-body { display: grid; grid-template-columns: minmax(0, 1fr) 372px; grid-template-rows: minmax(0, 1fr); flex: 1 1 auto; min-height: 0; position: relative; }

.rv.single .rv-panes { grid-template-columns: 1fr; grid-template-rows: 1fr; }
.rv.single .rv-pane:not(.is-shown) { display: none; }

/* ---------- admin ---------- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 12px; }
.filters .field { min-width: 140px; }
.filters .input { min-height: 36px; padding: 6px 8px; }
.drawer-side { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); z-index: 130; box-shadow: var(--shadow-float); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

.class-editor { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; padding: 14px 16px; border-top: 1px solid var(--line); }
.class-editor:first-child { border-top: 0; }

.split-train { color: var(--ok); } .split-val, .split-test { color: var(--text); }

/* ---------- training ---------- */
.train-grid { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; align-items: start; }
.train-steps { position: sticky; top: 0; display: flex; flex-direction: column; gap: 2px; }
.train-steps button { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 0; background: none; cursor: pointer; text-align: left; font-weight: 600; color: var(--text-2); }

.quiz-opt { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--line-2); border-radius: 10px; cursor: pointer; background: var(--panel); text-align: left; width: 100%; color: inherit; }
.quiz-opt:hover { background: var(--panel-2); }
.quiz-opt.is-right { border-color: var(--ok); background: var(--ok-bg); }
.quiz-opt.is-wrong { border-color: var(--danger); background: var(--danger-bg); }
.layer-demo { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

.layer-demo svg { width: 100%; height: auto; border-radius: 8px; background: #3A3733; }

var MaskOps = {};

/* Even-odd scanline fill at pixel centres; calls onSpan(y, x0, x1) for x in [x0, x1). */
MaskOps.scanPolygon = function (W, H, pts, onSpan) {
  var n = pts.length;
  if (n < 3) return;
  var minY = Infinity, maxY = -Infinity, i, j;
  for (i = 0; i < n; i++) { if (pts[i][1] < minY) minY = pts[i][1]; if (pts[i][1] > maxY) maxY = pts[i][1]; }
  var y0 = Math.max(0, Math.floor(minY)), y1 = Math.min(H - 1, Math.ceil(maxY));

  for (var y = y0; y <= y1; y++) {
    var cy = y + 0.5;

    for (i = 0, j = n - 1; i < n; j = i++) {
      var yi = pts[i][1], yj = pts[j][1];

function wsRenderHud() {

  else if (WS.drawingLocked) chips.push('<button class="hud-chip is-locked" type="button" data-a="lock">' + icon('lock') + 'Drawing locked, tap to unlock</button>');

  else {

function workerClassStats(workerId) {

/* ===================== 13-app.js — router, global events, demo panel, start-up ===================== */
var ROUTE_ROLES = { worker: ['worker', 'task', 'training', 'settings'], reviewer: ['review', 'training', 'settings', 'task'], admin: ['admin', 'review', 'training', 'settings', 'task'] };
var App = {
  quizAnswers: null, suppress: false, allowLeave: false,
  home: function () { var r = Session.role(); return r === 'worker' ? '#/worker' : r === 'reviewer' ? '#/review' : r === 'admin' ? '#/admin' : '#/login'; },
  go: function (hash) { if (location.hash === hash) App.render(); else location.hash = hash; },
  parse: function () {
    var h = location.hash || '', q = h.indexOf('?'), path = (q >= 0 ? h.slice(0, q) : h).replace(/^#/, '') || '/', params = {};
    if (q >= 0) h.slice(q + 1).split('&').forEach(function (kv) { if (!kv) return; var p = kv.split('='); params[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ''); });
    return { path: path, parts: path.split('/').filter(Boolean), params: params };
  },
  render: function () {
    var r = App.parse(), root = document.getElementById('app'), role = Session.role(), first = r.parts[0] || '';
    if (App.suppress) { App.suppress = false; return; }
    var leavingWorkspace = WS && !(first === 'task' && r.parts[1] === WS.task.id);
    if (leavingWorkspace && !App.allowLeave && WS.doc && !WS.readOnly && WS.saveStatus === 'save_failed') {
      var target = location.hash, back = '#/task/' + WS.task.id;
      App.suppress = true; location.hash = back;
      Modal.confirm({ title: 'Leave without saving?', body: 'Your latest changes could not be stored on this device. If you leave now they will be lost.', confirmLabel: 'Leave anyway', cancelLabel: 'Stay and keep editing', danger: true })
        .then(function (ok) { if (ok) { App.allowLeave = true; location.hash = target; } });
      return;
    }
    App.allowLeave = false;
    Sheet.close();
    while (Modal.isOpen()) Modal.close();
    $all('.drawer-side').forEach(function (d) { d.parentNode.remove(); });
    var pop = document.getElementById('ws-menu-pop'); if (pop) pop.remove();
    if (first !== 'task') closeWorkspace();
    if (!(first === 'review' && r.parts[1])) closeReview();
    if (!role) { if (first !== 'login') { location.replace('#/login'); return; } renderLogin(root); document.title = 'Sign in, Terucon Annotate'; return; }
    if (first === 'login' || !first) { location.replace(App.home()); return; }
    if ((ROUTE_ROLES[role] || []).indexOf(first) < 0) { location.replace(App.home()); return; }
    window.scrollTo(0, 0);
    if (first === 'task') { openWorkspace(r.parts[1], root); document.title = (r.parts[1] || 'Task') + ', Terucon Annotate'; return; }
    if (first === 'worker') renderWorkerHome(root, r.params);
    else if (first === 'training') renderTraining(root, r.params);
    else if (first === 'settings') renderSettings(root);
    else if (first === 'review') { if (r.parts[1]) renderReviewDetail(root, r.parts[1]); else renderReviewQueue(root, r.params); }
    else if (first === 'admin') {
      var sub = r.parts[1] || '';
      if (sub === 'tasks') renderAdminTasks(root); else if (sub === 'people') renderAdminPeople(root); else if (sub === 'policy') renderAdminPolicy(root);
      else if (sub === 'dataset') renderAdminDataset(root); else if (sub === 'tracking') renderAdminTracking(root); else renderAdminOverview(root);
    }
    document.title = 'Terucon Annotate';
  }
};

  $all('[data-sim]', modal).forEach(function (c) { c.addEventListener('change', function () { Demo.set(c.getAttribute('data-sim'), c.checked); if (WS) wsRefresh(['right', 'focus']); }); });

function init() {

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-app]');
    if (!el) return;
    var a = el.getAttribute('data-app'), drawer = document.getElementById('nav-drawer');
    if (a === 'nav' && drawer) drawer.classList.add('open');
    else if (a === 'nav-close' && drawer) drawer.classList.remove('open');
    else if (a === 'theme') { Settings.set('theme', isDark() ? 'light' : 'dark'); App.render(); }
    else if (a === 'account') openAccountMenu();
    else if (a === 'signout') signOut();
    else if (a === 'demo') { while (Modal.isOpen()) Modal.close(); if (drawer) drawer.classList.remove('open'); openDemoPanel(); }
  });
  document.addEventListener('click', function (e) { if (e.target.closest('#nav-drawer a')) { var d = document.getElementById('nav-drawer'); if (d) d.classList.remove('open'); } });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (Sheet.isOpen()) { Sheet.close(); e.stopPropagation(); }
    else if (Modal.isOpen()) { Modal.close(); e.stopPropagation(); }
  }, true);
  window.addEventListener('hashchange', App.render);
  window.addEventListener('storage', function (e) { if (WS) wsOnStorage(e); else if (e.key === Store.key('db')) DB.reload(); });
  window.addEventListener('online', function () { if (WS) wsSync(false); });
  window.addEventListener('offline', function () { if (WS && WS.saveStatus === 'synced') wsSetSaveStatus('saved_local', 'The connection dropped. New edits save on this device and sync later.'); });
  window.addEventListener('beforeunload', function (e) {
    if (!WS || !WS.doc || WS.readOnly) return;
    if (WS.dirty) wsSaveLocal('unload');
    if (WS.dirty || WS.saveStatus === 'save_failed') { e.preventDefault(); e.returnValue = ''; }
  });

  }, 200));

  App.render();
}
