# Render Blueprint for Terucon. On dashboard.render.com: New > Blueprint, pick this repo -
# Render finds this file automatically. swatchroom/DEPLOY.md has the full walkthrough of the Design Studio's settings.
#
# Two services:
#   terucon          the website AND the Design Studio (swatchroom/) in one Node process, built from the Dockerfile.
#   terucon-models   the Design Studio's local scan models (Python: SegFormer scene parsing, SlimSAM for the Pick tool).
#                    CPU only on Render (no GPU plans), so scans are slower than with a GPU - the studio falls
#                    back to Gemini outlines automatically if this service is ever unreachable, so it is not a
#                    hard dependency (the Pick tool does need it).
#
# MongoDB is NOT created here - Render has no managed MongoDB. MONGODB_URI is left blank
# (sync: false) for you to paste in after the blueprint deploys (MongoDB Atlas or your own).
#
# Sign-in (README, "Sign-in, accounts and the CRM"): every page but the landing page needs an account. AUTH_SECRET and AUTH_ADMIN_TOKEN are made
# for you (read the admin token from the service's Environment tab to use the admin API). Without a way to send a code (the AUTH_* provider
# variables below, or AUTH_GOOGLE_CLIENT_ID) nobody can sign in, and the sign-in page and /api/health say so: fail closed. TRUST_PROXY=1 below
# matters: without it every visitor looks like the same address and shares one rate limit.
#
# These settings were carried over from swatchroom/render.yaml (the studio's own blueprint) and have not been
# deployed from this repo yet: after the first deploy open /api/health, then /design-studio > Settings > Check.
services:
  - type: web
    name: terucon
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      # The Design Studio's settings (read by swatchroom/server/config.js from the environment)
      - key: MONGODB_URI
        sync: false # your MongoDB Atlas (or other) connection string
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false # the whole service-account JSON key, pasted as one line
      - key: GOOGLE_CLOUD_PROJECT
        sync: false # usually not needed - defaults to the key's own project_id
      - key: VERTEX_LOCATION
        value: global
      - key: MODEL_SERVICE_URL
        fromService:
          type: web
          name: terucon-models
          envVarKey: RENDER_EXTERNAL_URL
      - key: MODEL_SERVICE_KEY
        fromService:
          type: web
          name: terucon-models
          envVarKey: MODEL_SERVICE_KEY
      # The studio has no passcode: the website switches STUDIO_PASSCODE off, and server/lib/studioShield.js gives each browser only
      # its own rooms and rate limits the costly routes (README, "Keeping the open studio safe"). Set this to "on" (and STUDIO_PASSCODE
      # below) to keep a passcode instead.
      - key: STUDIO_REQUIRE_PASSCODE
        value: "off"
      - key: STUDIO_PASSCODE
        sync: false # only used when STUDIO_REQUIRE_PASSCODE is "on"
      - key: SESSION_SECRET
        generateValue: true
      - key: SECURE_COOKIES
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      # Admin dashboard (/admin): defaults to admin@terucon.in / admin@123 when left unset (swatchroom/server/config.js) -
      # set these to change them. Do this before sharing the URL with anyone.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # PostHog analytics for every page and the studio - leave POSTHOG_KEY blank to disable analytics entirely.
      - key: POSTHOG_KEY
        sync: false
      - key: POSTHOG_HOST
        value: https://us.i.posthog.com
      # Session replay on every page, all text and fields masked and photos blocked. Also switch replay on in the PostHog project.
      - key: POSTHOG_REPLAY
        value: "on"
      # The Modal GPU pools (swatchroom/modalBlueprint.py) - optional. Without ONEFORMER_URL the scan runs on the local
      # model only; without ANALYZE_URL the pipeline uses the three separate URLs below.
      - key: ONEFORMER_URL
        sync: false
      - key: ONEFORMER_KEY
        sync: false
      - key: ANALYZE_URL
        sync: false
      - key: ANALYZE_KEY
        sync: false
      # The room pipeline's three separate Modal-hosted models - optional; leave blank and the pipeline runs mocked
      # (PIPELINE_MOCK=auto).
      - key: SAM3_URL
        sync: false
      - key: SAM3_KEY
        sync: false
      - key: MOGE2_URL
        sync: false
      - key: MOGE2_KEY
        sync: false
      - key: MARIGOLD_URL
        sync: false
      - key: MARIGOLD_KEY
        sync: false
      # --- the catalogue (Finder, catalogue admin): docs/CATALOGUE_SETUP.md. All optional; with none of them the catalogue is simply off.
      # The two addresses `modal deploy modal_app.py` prints (run it from catalogue/), and ONE of its API_KEYS.
      - key: CATALOGUE_MODAL_SEARCH_URL
        sync: false
      - key: CATALOGUE_MODAL_INGEST_URL
        sync: false
      - key: CATALOGUE_MODAL_KEY
        sync: false
      # The bucket and the folder in it: the same values as in the Modal secret terucon-catalogue-gcp.
      - key: CATALOGUE_GCS_BUCKET
        sync: false
      - key: CATALOGUE_GCS_PREFIX
        value: catalogue/
      # The website signer's JSON key, as text: in the dashboard paste the downloaded file's text (or the same text as base64) as the value, with
      # no quotes. No file is needed on the server. (CATALOGUE_GCS_KEY_FILE still works if you prefer a Secret File, but do not set both.)
      # AUTH_ADMIN_TOKEN (above) is also the catalogue admin page's token.
      - key: CATALOGUE_GCS_KEY_JSON
        sync: false
      # The website wakes the studio's GPU services as soon as the landing page opens (see README, "Cold start").
      # "off" wakes them only when a photo is scanned, which is what the studio does on its own.
      - key: STUDIO_WARMUP
        value: "on"
      # --- sign-in and accounts. Accounts are kept in the same MongoDB as the studio's rooms (MONGODB_URI above).
      - key: AUTH_REQUIRED
        value: "on"
      - key: AUTH_SECRET
        generateValue: true # keys the one-time codes; 32+ characters
      - key: AUTH_ADMIN_TOKEN
        generateValue: true # the bearer token for /api/auth/admin/* (rate limits and settings, the security log, the CRM queue)
      # e-mail codes: AUTH_EMAIL_PROVIDER=smtp with the five below (Zoho Mail, SES, Brevo ... any SMTP service)
      - key: AUTH_EMAIL_PROVIDER
        sync: false
      - key: AUTH_EMAIL_FROM
        sync: false # Terucon <no-reply@your-domain>
      - key: AUTH_SMTP_HOST
        sync: false
      - key: AUTH_SMTP_PORT
        sync: false
      - key: AUTH_SMTP_USER
        sync: false
      - key: AUTH_SMTP_PASS
        sync: false
      # text-message codes: AUTH_SMS_PROVIDER=twilio (below) or webhook (your own URL for MSG91 and the like)
      - key: AUTH_SMS_PROVIDER
        sync: false
      - key: AUTH_SMS_TEMPLATE
        sync: false
      - key: AUTH_TWILIO_ACCOUNT_SID
        sync: false
      - key: AUTH_TWILIO_AUTH_TOKEN
        sync: false
      - key: AUTH_TWILIO_FROM
        sync: false
      - key: AUTH_SMS_WEBHOOK_URL
        sync: false
      - key: AUTH_SMS_WEBHOOK_TOKEN
        sync: false
      # Google One Tap: the OAuth client id (not secret); add this site's address under "Authorised JavaScript origins"
      - key: AUTH_GOOGLE_CLIENT_ID
        sync: false
      # CRM: sign-ups wait in a queue and are sent to Zoho once these are filled in
      - key: AUTH_CRM
        value: zoho
      - key: ZOHO_DC
        sync: false # in (India), com, eu, com.au, jp, ca, com.cn
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false

  - type: web
    name: terucon-models
    runtime: python
    plan: standard # needs real RAM for torch + transformers; Starter's 512MB is too small.
    # SegFormer-B5 (the default scan model) wants about 3 GB; on this 2 GB plan the service answers with B4 instead
    # (SCENE_B5_MIN_GB, see swatchroom/python/scene.py). Pick a 4 GB plan if you want B5 locally.
    region: oregon
    rootDir: swatchroom/python
    buildCommand: "pip install --upgrade pip && pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: MODEL_SERVICE_KEY
        generateValue: true
      - key: MODEL_DEVICE
        value: cpu
      - key: PYTHON_VERSION
        value: 3.11.9
