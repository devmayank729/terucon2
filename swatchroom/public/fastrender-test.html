<!doctype html>
<!--
  Dev-only diagnostic page for public/js/lib/fastrender/: drives the real renderer against a
  synthetic scene (a box room with known, verified geometry - see server/lib/fusion.test.js and
  the fixture under /_fixture-test/, generated by a script that calls the same server-side
  fusion.js + moge2.js this ships with) instead of a real photo. Not linked from the studio;
  open it directly (http://localhost:3000/fastrender-test.html) to sanity-check the shader
  after changing anything under fastrender/, without needing a live pipeline run first.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>fastrender test</title>
    <style>
      body { margin: 0; background: #222; font-family: monospace; color: #0f0; }
      canvas { display: block; background: #000; }
      #status { padding: 8px; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="status">loading...</div>
    <canvas id="stage"></canvas>
    <script type="module">
      import { createFastRenderer } from "/js/lib/fastrender/renderer.js";

      const statusEl = document.getElementById("status");
      function log(line) {
        statusEl.textContent += line + "\n";
      }

      async function fetchFloat32(url) {
        const buffer = await (await fetch(url)).arrayBuffer();
        return new Float32Array(buffer);
      }
      async function fetchUint16(url) {
        const buffer = await (await fetch(url)).arrayBuffer();
        return new Uint16Array(buffer);
      }

      async function main() {
        const meta = await (await fetch("/_fixture-test/meta.json")).json();
        const depth = await fetchFloat32("/_fixture-test/depth.bin");
        const shading = await fetchFloat32("/_fixture-test/shading.bin");
        const labelMap = await fetchUint16("/_fixture-test/labelMap.bin");
        log("fixture loaded: " + meta.width + "x" + meta.height);
        log("confidence: " + JSON.stringify(Object.fromEntries(Object.entries(meta.fusion.byId).map(([k, v]) => [k, v.confidence.toFixed(3)]))));

        const canvas = document.getElementById("stage");
        canvas.width = meta.width;
        canvas.height = meta.height;
        canvas.style.width = meta.width + "px";
        canvas.style.height = meta.height + "px";

        const renderer = await createFastRenderer(canvas);
        if (!renderer) {
          log("NO RENDERER AVAILABLE (neither WebGPU nor WebGL2)");
          document.title = "fastrender-test:done";
          return;
        }
        log("backend: " + renderer.kind);

        // intrinsics live alongside geometry server-side (room.fusion.geometry.camera); this
        // fixture keeps them in meta.intrinsics directly.
        renderer.uploadScene({
          scan: { width: meta.width, height: meta.height, labelMap: labelMap, regions: meta.regions },
          fusionRegions: meta.fusion.byId,
          depth: depth,
          shading: shading,
          intrinsics: meta.intrinsics,
        });

        const fullAlpha = new Float32Array(meta.width * meta.height).fill(1);
        renderer.setAlpha(fullAlpha);

        const okFloor = await renderer.setMaterial("floor", {
          texture: { url: "/textures/oak-planks.png", tileWidthM: 1.79, tileHeightM: 1.25 },
        }, 0);
        const okBack = await renderer.setMaterial("back", {
          texture: { url: "/textures/brick.png", tileWidthM: 1.31, tileHeightM: 0.84 },
        }, 0);
        const okLeft = await renderer.setMaterial("left", {
          texture: { url: "/textures/kota.png", tileWidthM: 1.8, tileHeightM: 1.26 },
        }, 0);
        log("setMaterial ok: floor=" + okFloor + " back=" + okBack + " left=" + okLeft);

        renderer.render();
        log("rendered.");

        // Ground-truth pixel readback, independent of any external screenshot tool: decode
        // the canvas's own presented bitmap via toDataURL() -> Image -> a plain 2D canvas.
        const dataUrl = canvas.toDataURL("image/png");
        const img = new Image();
        await new Promise(function (resolve, reject) {
          img.onload = resolve;
          img.onerror = reject;
          img.src = dataUrl;
        });
        const probe = document.createElement("canvas");
        probe.width = meta.width;
        probe.height = meta.height;
        const probeCtx = probe.getContext("2d");
        probeCtx.drawImage(img, 0, 0);
        const points = [
          ["center (back wall, should be brick red/brown)", Math.floor(meta.width / 2), Math.floor(meta.height / 2)],
          ["far left edge (background, should be transparent/black)", 5, Math.floor(meta.height / 2)],
          ["near top (ceiling-ish / background, no region assigned)", Math.floor(meta.width / 2), 5],
        ];
        for (const [label, x, y] of points) {
          const d = probeCtx.getImageData(x, y, 1, 1).data;
          log(label + " @(" + x + "," + y + "): rgba(" + d[0] + "," + d[1] + "," + d[2] + "," + d[3] + ")");
        }

        document.title = "fastrender-test:done";
      }

      main().catch(function (error) {
        log("ERROR: " + error.message);
        console.error(error);
        document.title = "fastrender-test:error";
      });
    </script>
  </body>
</html>
