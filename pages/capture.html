<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F150A">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Add photos — Terucon India</title>
<!-- the Terucon loader: the same one the other pages carry (site/brand/loader.html); loader.js is generated from it (node site/brand/build-loader.mjs) -->
<link rel="stylesheet" href="/brand/loader.css">
<script src="/brand/loader.js"></script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<!-- Zodiak and Switzer, the site's fonts (served with the Design Studio); the page reads fine in Georgia / Helvetica without them -->
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/brand/brand.css">
<link rel="stylesheet" href="/capture-ui/assets/capture-page.css">
</head>
<body>
<!--
  The page a phone opens from a QR code or a WhatsApp link (server/capture/, site/capture/). It has no site header, no menu and no assistant on
  purpose: the person holding the phone may have no account, and the link is for adding photos, nothing else. The key to the link is the part
  of the address after the # sign; a browser never sends that part to a server.
  Everything on the page is drawn by /capture-ui/assets/capture-page.js with textContent, never with markup built from text.
-->
<main id="app" class="cp" aria-live="polite">
  <header class="cp-top">
    <img class="tc-logo tc-logo--header cp-logo" src="/brand/logo-header-320.webp" srcset="/brand/logo-header-160.webp 160w, /brand/logo-header-320.webp 320w, /brand/logo-header-480.webp 480w" sizes="190px" width="190" height="33" alt="Terucon India">
  </header>
  <div id="root" class="cp-body"></div>
</main>
<noscript><p class="cp-noscript">This page needs JavaScript to take and send photos.</p></noscript>
<script type="module" src="/capture-ui/assets/capture-page.js"></script>
</body>
</html>
