<!-- Terucon loader. Paste as the first thing inside the body; call TeruconLoader.done() when the page is ready.
     One style block, one element, one script block; the only request is the logo mark. No style attributes and no
     inline event handlers (both are blocked by a strict Content-Security-Policy); the script sets styles through the CSSOM.
     Keep tag names with angle brackets out of this comment: server/lib/csp.js finds inline blocks with a plain pattern.
     The loader stays hidden until its own script has run, so a visitor without JavaScript, or a page that blocks
     inline scripts, is never left behind a screen that cannot close.

     The style block is a copy of loader.css and the markup is copied into transition.js: edit loader.css / this markup,
     then run `node site/brand/build-loader.mjs` (tests/js/brand-loader.test.js fails when they drift apart).

     One CYCLE is one full pass of the brand animation (loader.css): a light scans the T-block line-work into view
     (LED sweep), the accent strips light, the line-work resolves into the logo, the name and tagline settle; it holds
     composed, dissolves, and starts again. The loop wraps at the composed state, so there is no restart flash.
     CYCLE_MS below is pushed to CSS as --cyc.

     Attributes on the element (set by tools/build-dist.js per page):
       data-tc-mode="studio"     the Design Studio entry: no quick mode, at least MIN_CYCLES cycles after the start, release at a
                                 composed moment; the start is the click on a link to the studio when transition.js
                                 stored it (sessionStorage "tc-go"), so the loader continues across the navigation
       data-tc-exit="dissolve"   the page opens its own curtain (the landing hero's louvres): the loader fades instead
                                 of opening its slats, then fires "tc-ld-exit" on window (the hero starts opening then)

     API: TeruconLoader.done() opens the curtain and removes the loader; TeruconLoader.fail(message?) shows the
     "taking longer than usual" screen (done() still works afterwards); TeruconLoader.note(text) shows a quiet status line;
     TeruconLoader.hold() cancels the automatic fail() because the page is up and only waiting (the studio entry calls it once the
     studio's first screen exists, so waiting for the GPU is never shown as a failure).
     fail() runs by itself after FAIL_MS without done() or hold(), and when a same-origin script src fails to load
     (add data-tc-optional to a script that may fail quietly). -->
