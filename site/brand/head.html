<!-- Terucon: tags every page carries inside <head>. Page-specific title, description, og:title,
     og:description, og:url and an absolute og:image URL are added per page (DIST), because social
     scrapers need absolute URLs and this file has no domain.
     The last two lines are the site chrome (chrome.md): the one header on every page; the page patches hide the export's own header while it is on. -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1F150A">
<meta name="color-scheme" content="only light">
<meta name="application-name" content="Terucon India">
<meta name="apple-mobile-web-app-title" content="Terucon">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Terucon India">
<meta property="og:locale" content="en_IN">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Terucon India: the T-block logo over the wordmark">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/brand/chrome.css">
<script src="/brand/chrome.js"></script>
<link rel="stylesheet" href="/brand/terubot.css">
<script src="/brand/terubot.js" defer></script>
<script src="/brand/transition.js" defer></script>
